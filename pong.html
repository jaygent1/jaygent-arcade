<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CYBER PONG — JAY GENT</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎩</text></svg>">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #03030a;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Courier New', monospace;
  }
  .game-container {
    position: relative;
  }
  canvas {
    display: block;
    border: 2px solid #00ffaa;
    border-radius: 4px;
    box-shadow: 0 0 40px rgba(0,255,170,0.15);
  }
  #hud {
    position: absolute;
    top: 20px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    gap: 100px;
    pointer-events: none;
  }
  .score {
    font-size: 48px;
    font-weight: bold;
  }
  .player-score { color: #00ffaa; }
  .ai-score { color: #ff6b6b; }
  #message {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #00ffaa;
    font-size: 20px;
    text-align: center;
    pointer-events: none;
  }
  .controls {
    position: absolute;
    bottom: -35px;
    left: 0;
    right: 0;
    text-align: center;
    color: #444;
    font-size: 12px;
  }
  #backBtn {
    position: absolute;
    top: -45px;
    left: 0;
    background: none;
    border: 1px solid #333;
    color: #666;
    padding: 8px 16px;
    font-family: inherit;
    cursor: pointer;
    border-radius: 4px;
    text-decoration: none;
  }
  #backBtn:hover { border-color: #00ffaa; color: #00ffaa; }
  #difficulty {
    position: absolute;
    top: -45px;
    right: 0;
    display: flex;
    gap: 8px;
  }
  .diff-btn {
    background: none;
    border: 1px solid #333;
    color: #666;
    padding: 8px 12px;
    font-family: inherit;
    font-size: 11px;
    cursor: pointer;
    border-radius: 4px;
  }
  .diff-btn:hover, .diff-btn.active { border-color: #00ffaa; color: #00ffaa; }
</style>
</head>
<body>
<div class="game-container">
  <a href="/" id="backBtn">← Back</a>
  <div id="difficulty">
    <button class="diff-btn" onclick="setDifficulty('easy')">EASY</button>
    <button class="diff-btn active" onclick="setDifficulty('normal')">NORMAL</button>
    <button class="diff-btn" onclick="setDifficulty('hard')">HARD</button>
  </div>
  <canvas id="game" width="800" height="500"></canvas>
  <div id="hud">
    <span class="score player-score" id="playerScore">0</span>
    <span class="score ai-score" id="aiScore">0</span>
  </div>
  <div id="message">CYBER PONG<br><br>Press SPACE to serve<br>First to 11 wins</div>
  <div class="controls">W/S or ↑/↓ to move paddle</div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// Game settings
let difficulty = 'normal';
const DIFFICULTIES = {
  easy: { aiSpeed: 4, aiReaction: 0.03 },
  normal: { aiSpeed: 6, aiReaction: 0.06 },
  hard: { aiSpeed: 8, aiReaction: 0.1 }
};

// Paddle settings
const PADDLE_WIDTH = 12;
const PADDLE_HEIGHT = 80;
const PADDLE_SPEED = 8;

// Ball settings
const BALL_SIZE = 12;
const BALL_SPEED_INITIAL = 7;
const BALL_SPEED_MAX = 14;

// Game state
let playerY = H/2 - PADDLE_HEIGHT/2;
let aiY = H/2 - PADDLE_HEIGHT/2;
let ball = { x: W/2, y: H/2, vx: 0, vy: 0, speed: BALL_SPEED_INITIAL };
let playerScore = 0;
let aiScore = 0;
let serving = true;
let gameOver = false;
let particles = [];
let trails = [];

// Input
const keys = {};
document.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Space' && serving && !gameOver) {
    serve();
  }
  if (e.code === 'Space' && gameOver) {
    resetGame();
  }
});
document.addEventListener('keyup', e => keys[e.code] = false);

function setDifficulty(d) {
  difficulty = d;
  document.querySelectorAll('.diff-btn').forEach(btn => btn.classList.remove('active'));
  document.querySelector(`.diff-btn:nth-child(${d === 'easy' ? 1 : d === 'normal' ? 2 : 3})`).classList.add('active');
}

function serve() {
  serving = false;
  ball.x = W/2;
  ball.y = H/2;
  ball.speed = BALL_SPEED_INITIAL;
  
  // Random direction, always toward a player
  const angle = (Math.random() - 0.5) * Math.PI * 0.5;
  const dir = Math.random() > 0.5 ? 1 : -1;
  ball.vx = Math.cos(angle) * ball.speed * dir;
  ball.vy = Math.sin(angle) * ball.speed;
  
  document.getElementById('message').textContent = '';
  
  // Track for onboarding
  if (playerScore === 0 && aiScore === 0) {
    window.Onboarding?.trackGameStart('pong');
    window.Onboarding?.showTutorial('pong');
  }
}

function resetGame() {
  playerScore = 0;
  aiScore = 0;
  gameOver = false;
  serving = true;
  ball.vx = 0;
  ball.vy = 0;
  updateScores();
  document.getElementById('message').innerHTML = 'Press SPACE to serve';
}

function score(player) {
  if (player === 'player') {
    playerScore++;
    // Explosion at AI side
    createExplosion(W - 30, ball.y, '#00ffaa');
  } else {
    aiScore++;
    // Explosion at player side
    createExplosion(30, ball.y, '#ff6b6b');
  }
  
  updateScores();
  
  if (playerScore >= 11 || aiScore >= 11) {
    gameOver = true;
    const won = playerScore >= 11;
    document.getElementById('message').innerHTML = won 
      ? 'YOU WIN!<br><br>Press SPACE to play again'
      : 'AI WINS<br><br>Press SPACE to play again';
    
    // Submit score
    window.Onboarding?.trackGameEnd('pong', playerScore, difficulty === 'easy' ? 1 : difficulty === 'normal' ? 2 : 3);
    submitScore(won);
  } else {
    serving = true;
    ball.vx = 0;
    ball.vy = 0;
    ball.x = W/2;
    ball.y = H/2;
  }
}

async function submitScore(won) {
  const scoreVal = won ? 100 + (11 - aiScore) * 10 : playerScore * 5;
  const name = localStorage.getItem('arcade_name') || 'AAA';
  try {
    if (window.ArcadeAuth?.submitScore) {
      await window.ArcadeAuth.submitScore(scoreVal, playerScore, 'pong', 'HUMAN');
    } else {
      await fetch('/api/scores', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, score: scoreVal, wave: playerScore, game: 'pong' })
      });
    }
  } catch (e) {}
}

function updateScores() {
  document.getElementById('playerScore').textContent = playerScore;
  document.getElementById('aiScore').textContent = aiScore;
}

function createExplosion(x, y, color) {
  for (let i = 0; i < 20; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 2 + Math.random() * 5;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 30 + Math.random() * 20,
      color
    });
  }
}

function update() {
  if (gameOver || serving) return;
  
  // Player movement
  if (keys['ArrowUp'] || keys['KeyW']) {
    playerY = Math.max(0, playerY - PADDLE_SPEED);
  }
  if (keys['ArrowDown'] || keys['KeyS']) {
    playerY = Math.min(H - PADDLE_HEIGHT, playerY + PADDLE_SPEED);
  }
  
  // AI movement
  const settings = DIFFICULTIES[difficulty];
  const targetY = ball.y - PADDLE_HEIGHT/2;
  const diff = targetY - aiY;
  
  // Add some reaction delay and imperfection
  if (Math.abs(diff) > 10) {
    const moveAmount = Math.sign(diff) * Math.min(settings.aiSpeed, Math.abs(diff) * settings.aiReaction + 2);
    aiY += moveAmount;
    aiY = Math.max(0, Math.min(H - PADDLE_HEIGHT, aiY));
  }
  
  // Ball movement
  ball.x += ball.vx;
  ball.y += ball.vy;
  
  // Ball trail
  if (Math.abs(ball.vx) > 0) {
    trails.push({ x: ball.x, y: ball.y, life: 10 });
  }
  
  // Top/bottom bounce
  if (ball.y <= BALL_SIZE/2 || ball.y >= H - BALL_SIZE/2) {
    ball.vy *= -1;
    ball.y = ball.y <= BALL_SIZE/2 ? BALL_SIZE/2 : H - BALL_SIZE/2;
  }
  
  // Player paddle collision
  if (ball.x - BALL_SIZE/2 <= 30 + PADDLE_WIDTH &&
      ball.y >= playerY && ball.y <= playerY + PADDLE_HEIGHT &&
      ball.vx < 0) {
    const hitPos = (ball.y - playerY) / PADDLE_HEIGHT - 0.5;
    ball.vx = Math.abs(ball.vx);
    ball.vy = hitPos * 10;
    ball.speed = Math.min(ball.speed + 0.3, BALL_SPEED_MAX);
    normalizeVelocity();
    createExplosion(30 + PADDLE_WIDTH, ball.y, '#00ffaa');
  }
  
  // AI paddle collision
  if (ball.x + BALL_SIZE/2 >= W - 30 - PADDLE_WIDTH &&
      ball.y >= aiY && ball.y <= aiY + PADDLE_HEIGHT &&
      ball.vx > 0) {
    const hitPos = (ball.y - aiY) / PADDLE_HEIGHT - 0.5;
    ball.vx = -Math.abs(ball.vx);
    ball.vy = hitPos * 10;
    ball.speed = Math.min(ball.speed + 0.3, BALL_SPEED_MAX);
    normalizeVelocity();
    createExplosion(W - 30 - PADDLE_WIDTH, ball.y, '#ff6b6b');
  }
  
  // Score
  if (ball.x < 0) score('ai');
  if (ball.x > W) score('player');
  
  // Update particles
  particles = particles.filter(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.vx *= 0.95;
    p.vy *= 0.95;
    p.life--;
    return p.life > 0;
  });
  
  // Update trails
  trails = trails.filter(t => {
    t.life--;
    return t.life > 0;
  });
}

function normalizeVelocity() {
  const mag = Math.sqrt(ball.vx**2 + ball.vy**2);
  ball.vx = (ball.vx / mag) * ball.speed;
  ball.vy = (ball.vy / mag) * ball.speed;
}

function draw() {
  // Background
  ctx.fillStyle = '#03030a';
  ctx.fillRect(0, 0, W, H);
  
  // Center line
  ctx.strokeStyle = '#1a1a2e';
  ctx.lineWidth = 4;
  ctx.setLineDash([20, 15]);
  ctx.beginPath();
  ctx.moveTo(W/2, 0);
  ctx.lineTo(W/2, H);
  ctx.stroke();
  ctx.setLineDash([]);
  
  // Particles
  particles.forEach(p => {
    ctx.fillStyle = p.color;
    ctx.globalAlpha = p.life / 50;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;
  
  // Ball trail
  trails.forEach(t => {
    ctx.fillStyle = '#00ffaa';
    ctx.globalAlpha = t.life / 15;
    ctx.beginPath();
    ctx.arc(t.x, t.y, BALL_SIZE/2 * (t.life/10), 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;
  
  // Paddles
  ctx.fillStyle = '#00ffaa';
  ctx.shadowColor = '#00ffaa';
  ctx.shadowBlur = 15;
  ctx.fillRect(30, playerY, PADDLE_WIDTH, PADDLE_HEIGHT);
  
  ctx.fillStyle = '#ff6b6b';
  ctx.shadowColor = '#ff6b6b';
  ctx.fillRect(W - 30 - PADDLE_WIDTH, aiY, PADDLE_WIDTH, PADDLE_HEIGHT);
  ctx.shadowBlur = 0;
  
  // Ball
  ctx.fillStyle = '#fff';
  ctx.shadowColor = '#fff';
  ctx.shadowBlur = 20;
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, BALL_SIZE/2, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
