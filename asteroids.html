<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASTEROID FIELD — JAY GENT</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎩</text></svg>">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #03030a;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Courier New', monospace;
  }
  .game-container {
    position: relative;
  }
  canvas {
    display: block;
    border: 1px solid #1a1a2e;
    border-radius: 8px;
  }
  #hud {
    position: absolute;
    top: 10px;
    left: 10px;
    right: 10px;
    display: flex;
    justify-content: space-between;
    color: #00ffaa;
    font-size: 18px;
    pointer-events: none;
  }
  #message {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #00ffaa;
    font-size: 24px;
    text-align: center;
    pointer-events: none;
  }
  .controls {
    position: absolute;
    bottom: -40px;
    left: 0;
    right: 0;
    text-align: center;
    color: #444;
    font-size: 12px;
  }
  #backBtn {
    position: absolute;
    top: -50px;
    left: 0;
    background: none;
    border: 1px solid #333;
    color: #666;
    padding: 8px 16px;
    font-family: inherit;
    cursor: pointer;
    border-radius: 4px;
  }
  #backBtn:hover { border-color: #00ffaa; color: #00ffaa; }
</style>
</head>
<body>
<div class="game-container">
  <button id="backBtn" onclick="window.location.href='/'">← Back</button>
  <canvas id="game" width="700" height="700"></canvas>
  <div id="hud">
    <span>SCORE: <span id="scoreVal">0</span></span>
    <span>LEVEL: <span id="levelVal">1</span></span>
    <span>LIVES: <span id="livesVal">3</span></span>
  </div>
  <div id="message">Press SPACE to start</div>
  <div class="controls">↑ Thrust · ← → Rotate · SPACE Shoot · SHIFT Hyperspace</div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// Game state
let gameRunning = false;
let score = 0;
let lives = 3;
let level = 1;

// Ship
const ship = {
  x: W/2, y: H/2,
  vx: 0, vy: 0,
  angle: -Math.PI/2,
  radius: 15,
  invincible: 0,
  thrust: false
};

// Entities
let bullets = [];
let asteroids = [];
let particles = [];

// Input
const keys = {};
document.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Space' && !gameRunning) {
    startGame();
  }
});
document.addEventListener('keyup', e => keys[e.code] = false);

// Start game
function startGame() {
  score = 0;
  lives = 3;
  level = 1;
  ship.x = W/2; ship.y = H/2;
  ship.vx = 0; ship.vy = 0;
  ship.angle = -Math.PI/2;
  ship.invincible = 180;
  bullets = [];
  asteroids = [];
  particles = [];
  gameRunning = true;
  spawnAsteroids(4);
  document.getElementById('message').textContent = '';
  updateHUD();
  
  // Track for onboarding
  window.Onboarding?.trackGameStart('asteroids');
  window.Onboarding?.showTutorial('asteroids');
}

function spawnAsteroids(count) {
  for (let i = 0; i < count; i++) {
    let x, y;
    do {
      x = Math.random() * W;
      y = Math.random() * H;
    } while (dist(x, y, ship.x, ship.y) < 150);
    
    asteroids.push(createAsteroid(x, y, 'large'));
  }
}

function createAsteroid(x, y, size) {
  const sizes = { large: 40, medium: 25, small: 12 };
  const speeds = { large: 1, medium: 1.5, small: 2.5 };
  const points = { large: 20, medium: 50, small: 100 };
  
  const angle = Math.random() * Math.PI * 2;
  const speed = speeds[size] * (0.8 + Math.random() * 0.4);
  
  // Generate jagged shape
  const verts = [];
  const numVerts = 8 + Math.floor(Math.random() * 5);
  for (let i = 0; i < numVerts; i++) {
    const a = (i / numVerts) * Math.PI * 2;
    const r = sizes[size] * (0.7 + Math.random() * 0.3);
    verts.push({ x: Math.cos(a) * r, y: Math.sin(a) * r });
  }
  
  return {
    x, y,
    vx: Math.cos(angle) * speed,
    vy: Math.sin(angle) * speed,
    radius: sizes[size],
    size,
    points: points[size],
    verts,
    rotation: Math.random() * Math.PI * 2,
    rotSpeed: (Math.random() - 0.5) * 0.02
  };
}

function dist(x1, y1, x2, y2) {
  return Math.sqrt((x2-x1)**2 + (y2-y1)**2);
}

// Shooting
let shootCooldown = 0;
function shoot() {
  if (shootCooldown > 0) return;
  shootCooldown = 15;
  
  const speed = 10;
  bullets.push({
    x: ship.x + Math.cos(ship.angle) * ship.radius,
    y: ship.y + Math.sin(ship.angle) * ship.radius,
    vx: Math.cos(ship.angle) * speed + ship.vx * 0.5,
    vy: Math.sin(ship.angle) * speed + ship.vy * 0.5,
    life: 50
  });
}

// Hyperspace
let hyperCooldown = 0;
function hyperspace() {
  if (hyperCooldown > 0) return;
  hyperCooldown = 120;
  
  // Random teleport with risk
  ship.x = Math.random() * W;
  ship.y = Math.random() * H;
  ship.vx = 0;
  ship.vy = 0;
  
  // 10% chance of exploding
  if (Math.random() < 0.1) {
    die();
  }
}

function die() {
  lives--;
  updateHUD();
  
  // Explosion particles
  for (let i = 0; i < 30; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 2 + Math.random() * 4;
    particles.push({
      x: ship.x, y: ship.y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 40 + Math.random() * 20,
      color: '#00ffaa'
    });
  }
  
  if (lives <= 0) {
    gameOver();
  } else {
    // Respawn
    ship.x = W/2; ship.y = H/2;
    ship.vx = 0; ship.vy = 0;
    ship.invincible = 180;
  }
}

function gameOver() {
  gameRunning = false;
  document.getElementById('message').innerHTML = `GAME OVER<br>Score: ${score}<br><br>Press SPACE to restart`;
  
  // Track for onboarding
  window.Onboarding?.trackGameEnd('asteroids', score, level);
  
  // Submit score
  submitScore();
}

async function submitScore() {
  const name = localStorage.getItem('arcade_name') || 'AAA';
  try {
    if (window.ArcadeAuth?.submitScore) {
      await window.ArcadeAuth.submitScore(score, level, 'asteroids', 'HUMAN');
    } else {
      await fetch('/api/scores', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, score, wave: level, game: 'asteroids' })
      });
    }
  } catch (e) {}
}

function nextLevel() {
  level++;
  updateHUD();
  ship.invincible = 120;
  spawnAsteroids(4 + level);
}

function updateHUD() {
  document.getElementById('scoreVal').textContent = score;
  document.getElementById('levelVal').textContent = level;
  document.getElementById('livesVal').textContent = lives;
}

function wrap(obj) {
  if (obj.x < -50) obj.x = W + 50;
  if (obj.x > W + 50) obj.x = -50;
  if (obj.y < -50) obj.y = H + 50;
  if (obj.y > H + 50) obj.y = -50;
}

function update() {
  if (!gameRunning) return;
  
  // Input
  if (keys['ArrowLeft'] || keys['KeyA']) ship.angle -= 0.08;
  if (keys['ArrowRight'] || keys['KeyD']) ship.angle += 0.08;
  
  ship.thrust = keys['ArrowUp'] || keys['KeyW'];
  if (ship.thrust) {
    ship.vx += Math.cos(ship.angle) * 0.15;
    ship.vy += Math.sin(ship.angle) * 0.15;
    
    // Thrust particles
    if (Math.random() > 0.5) {
      particles.push({
        x: ship.x - Math.cos(ship.angle) * ship.radius,
        y: ship.y - Math.sin(ship.angle) * ship.radius,
        vx: -Math.cos(ship.angle) * 3 + (Math.random()-0.5),
        vy: -Math.sin(ship.angle) * 3 + (Math.random()-0.5),
        life: 15,
        color: '#ff6b6b'
      });
    }
  }
  
  if (keys['Space']) shoot();
  if (keys['ShiftLeft'] || keys['ShiftRight']) hyperspace();
  
  // Friction
  ship.vx *= 0.995;
  ship.vy *= 0.995;
  
  // Max speed
  const speed = Math.sqrt(ship.vx**2 + ship.vy**2);
  if (speed > 8) {
    ship.vx = (ship.vx / speed) * 8;
    ship.vy = (ship.vy / speed) * 8;
  }
  
  // Move ship
  ship.x += ship.vx;
  ship.y += ship.vy;
  wrap(ship);
  
  // Cooldowns
  if (shootCooldown > 0) shootCooldown--;
  if (hyperCooldown > 0) hyperCooldown--;
  if (ship.invincible > 0) ship.invincible--;
  
  // Bullets
  bullets = bullets.filter(b => {
    b.x += b.vx;
    b.y += b.vy;
    b.life--;
    wrap(b);
    return b.life > 0;
  });
  
  // Asteroids
  asteroids.forEach(a => {
    a.x += a.vx;
    a.y += a.vy;
    a.rotation += a.rotSpeed;
    wrap(a);
  });
  
  // Particles
  particles = particles.filter(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.vx *= 0.98;
    p.vy *= 0.98;
    p.life--;
    return p.life > 0;
  });
  
  // Collision: bullets vs asteroids
  bullets.forEach(b => {
    asteroids.forEach((a, i) => {
      if (dist(b.x, b.y, a.x, a.y) < a.radius) {
        b.life = 0;
        score += a.points;
        updateHUD();
        
        // Explosion particles
        for (let j = 0; j < 8; j++) {
          const angle = Math.random() * Math.PI * 2;
          particles.push({
            x: a.x, y: a.y,
            vx: Math.cos(angle) * 2,
            vy: Math.sin(angle) * 2,
            life: 20,
            color: '#666'
          });
        }
        
        // Split asteroid
        if (a.size === 'large') {
          asteroids.push(createAsteroid(a.x, a.y, 'medium'));
          asteroids.push(createAsteroid(a.x, a.y, 'medium'));
        } else if (a.size === 'medium') {
          asteroids.push(createAsteroid(a.x, a.y, 'small'));
          asteroids.push(createAsteroid(a.x, a.y, 'small'));
        }
        
        asteroids.splice(i, 1);
      }
    });
  });
  
  // Collision: ship vs asteroids
  if (ship.invincible <= 0) {
    for (const a of asteroids) {
      if (dist(ship.x, ship.y, a.x, a.y) < ship.radius + a.radius * 0.7) {
        die();
        break;
      }
    }
  }
  
  // Level complete
  if (asteroids.length === 0 && gameRunning) {
    nextLevel();
  }
}

function draw() {
  ctx.fillStyle = '#03030a';
  ctx.fillRect(0, 0, W, H);
  
  // Stars (static background)
  ctx.fillStyle = '#222';
  for (let i = 0; i < 50; i++) {
    const x = (i * 137) % W;
    const y = (i * 97) % H;
    ctx.fillRect(x, y, 1, 1);
  }
  
  // Particles
  particles.forEach(p => {
    ctx.fillStyle = p.color;
    ctx.globalAlpha = p.life / 40;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;
  
  // Asteroids
  ctx.strokeStyle = '#888';
  ctx.lineWidth = 2;
  asteroids.forEach(a => {
    ctx.save();
    ctx.translate(a.x, a.y);
    ctx.rotate(a.rotation);
    ctx.beginPath();
    ctx.moveTo(a.verts[0].x, a.verts[0].y);
    for (let i = 1; i < a.verts.length; i++) {
      ctx.lineTo(a.verts[i].x, a.verts[i].y);
    }
    ctx.closePath();
    ctx.stroke();
    ctx.restore();
  });
  
  // Ship
  if (ship.invincible <= 0 || Math.floor(ship.invincible / 4) % 2 === 0) {
    ctx.save();
    ctx.translate(ship.x, ship.y);
    ctx.rotate(ship.angle);
    
    ctx.strokeStyle = '#00ffaa';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(ship.radius, 0);
    ctx.lineTo(-ship.radius * 0.7, -ship.radius * 0.6);
    ctx.lineTo(-ship.radius * 0.4, 0);
    ctx.lineTo(-ship.radius * 0.7, ship.radius * 0.6);
    ctx.closePath();
    ctx.stroke();
    
    // Thrust flame
    if (ship.thrust) {
      ctx.strokeStyle = '#ff6b6b';
      ctx.beginPath();
      ctx.moveTo(-ship.radius * 0.5, -ship.radius * 0.3);
      ctx.lineTo(-ship.radius * 1.2, 0);
      ctx.lineTo(-ship.radius * 0.5, ship.radius * 0.3);
      ctx.stroke();
    }
    
    ctx.restore();
  }
  
  // Bullets
  ctx.fillStyle = '#00ffaa';
  bullets.forEach(b => {
    ctx.beginPath();
    ctx.arc(b.x, b.y, 3, 0, Math.PI * 2);
    ctx.fill();
  });
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
